# config.yaml - Configuration file for Machine Learning Pipeline

raw_data_path: "./data/synthetic_data_204.csv"
target_column: "customer_churn"
random_seed: 42

# Data Preprocessing Settings
raw_features:
  - "monthly_spend"
  - "number_of_store_visits_per_month"
  - "customer_satisfaction_score"
  - "number_of_complaints"
  - "membership_tier"
  - "discount_usage_rate"

numerical_features:
  - "monthly_spend"
  - "number_of_store_visits_per_month"
  - "customer_satisfaction_score"
  - "number_of_complaints"
  - "discount_usage_rate"
  - "spend_per_visit"
  - "complaint_dissatisfaction"

categorical_features:
  - "membership_tier"

imputer_strategy_num: "median"
imputer_strategy_cat: "most_frequent"
scaler: "robust"
outlier_capping: true
iqr_multiplier: 1.5

# Model Cross-Validation and Hyperparameter Optimization Settings
cv_folds: 5
scoring_metric: "f1"
search_type: "grid" # 'grid' or 'random'
n_iter_search: 10

# Hyperparameter Grid Settings
param_grid:
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
    solver: ["lbfgs"]
    class_weight: ["balanced", null]
    max_iter: [1000]
  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [3, 5, 8, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    class_weight: ["balanced", "balanced_subsample", null]
  gradient_boosting:
    n_estimators: [50, 100, 150]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    max_depth: [3, 5, 7]
    subsample: [0.8, 1.0]
    min_samples_split: [2, 5]
