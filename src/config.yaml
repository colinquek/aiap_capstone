# Customer Churn Pipeline Configuration

# File Paths & Pipeline Data Inputs
file_path: "data/synthetic_data_204.csv"
raw_data_path: "data/synthetic_data_204.csv"
model_output_dir: "models/"

# Target Column Definition
target_column: "customer_churn"

# Experiment Control Parameters
random_state: 42
random_seed: 42
test_size: 0.2
baseline_model_type: "logistic_regression"

# Feature Categorization
raw_features:
  - "monthly_spend"
  - "number_of_store_visits_per_month"
  - "customer_satisfaction_score"
  - "number_of_complaints"
  - "membership_tier"
  - "discount_usage_rate"

numerical_features:
  - "monthly_spend"
  - "number_of_store_visits_per_month"
  - "customer_satisfaction_score"
  - "number_of_complaints"
  - "discount_usage_rate"
  - "spend_per_visit"
  - "complaint_dissatisfaction"

ordinal_features:
  - "membership_tier"

ordinal_categories:
  - ["Basic", "Pro", "Premium"]

# Data Quality & Cleaning Parameters
imputation:
  numerical_strategy: "median"
  ordinal_strategy: "most_frequent"

outlier_handling:
  enabled: true
  iqr_multiplier: 1.5